[package]
name = "dispatched"
description = "Fast, cross-platform Azure Service Bus explorer (CLI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "dispatched"
path = "src/main.rs"

[dependencies]
dispatched-core = { workspace = true }
horizon-azure-kit = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The client side of rmcp, for the in-process end-to-end tests of `dispatched mcp`.
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tempfile = "3"
time = { workspace = true, features = ["macros"] }
