[package]
name = "dispatched-core"
description = "Core library for Dispatched, a cross-platform Azure Service Bus explorer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Seeding helpers used by integration tests (send, dead-letter, drain).
test-support = []

[dependencies]
horizon-azure-kit = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
fe2o3-amqp = { workspace = true }
fe2o3-amqp-cbs = { workspace = true }
fe2o3-amqp-management = { workspace = true }
fe2o3-amqp-types = { workspace = true }
fe2o3-amqp-ws = { workspace = true }
percent-encoding = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_amqp = { workspace = true }
serde_json = { workspace = true }
serde_json_path = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# fe2o3-amqp 0.18.2 fails to compile with tokio-util >= 0.7.20 (ambiguous codec impls); remove when fe2o3 fixes it
tokio-util = ">=0.7, <0.7.20"
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
serde_bytes = "0.11"
tokio = { version = "1", features = ["full", "test-util"] }

[[test]]
name = "emulator_m0"
required-features = ["test-support"]

[[test]]
name = "emulator_m1"
required-features = ["test-support"]
