[package]
name = "dispatched-app"
description = "Dispatched desktop app (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "dispatched_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = { workspace = true }
dispatched-core = { workspace = true }
horizon-azure-kit = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# Each Tauri crate stays on the same major.minor as its npm package in
# app/package.json (`tauri build` refuses a mismatch). The newer lines
# (tauri 2.12, plugin-process 2.4, plugin-updater 2.13+) need Rust 1.90,
# above the workspace MSRV of 1.88; move a crate and its npm package together.
tauri = { version = "~2.11", features = [] }
# Rust side only (no npm package): the save dialog for exports is opened by Rust.
# 2.8+ needs Rust 1.90.
tauri-plugin-dialog = "~2.7"
tauri-plugin-process = "~2.3"
tauri-plugin-updater = "~2.12"
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
uuid = { workspace = true }

[dev-dependencies]
secrecy = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
