name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    working-directory: dispatched
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: dispatched }
      - uses: actions/checkout@v4
        with: { repository: Horizon-Tech-doo/horizon-azure-kit, ref: v0.2.1, path: horizon-azure-kit }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "dispatched -> target" }
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy -p dispatched-core --all-targets --features test-support --locked -- -D warnings
      - run: cargo test --locked
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: dispatched }
      - uses: actions/checkout@v4
        with: { repository: Horizon-Tech-doo/horizon-azure-kit, ref: v0.2.1, path: horizon-azure-kit }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "dispatched -> target" }
      # The Tauri crate embeds app/dist at compile time, so build the frontend first.
      - run: npm ci && npm run build
        working-directory: dispatched/app
      - run: cargo clippy -p dispatched-app --all-targets --locked -- -D warnings && cargo test -p dispatched-app --locked
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: dispatched }
      - uses: actions/checkout@v4
        with: { repository: Horizon-Tech-doo/horizon-azure-kit, ref: v0.2.1, path: horizon-azure-kit }
      # The desktop gate (emulator_m2b) compiles the Tauri crate: its system libraries, and the
      # frontend it embeds at compile time.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: dispatched/app
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "dispatched -> target" }
      # ubuntu runners are x86_64, so emulator.sh uses only the default compose file.
      - run: testing/emulator/emulator.sh up
      - name: Run the emulator gate tests
        shell: bash
        run: |
          set -o pipefail
          DISPATCHED_EMULATOR=1 cargo test --locked -p dispatched-core --features test-support --test emulator_m0 --test emulator_m1 --test emulator_m1c --test emulator_m2a --test emulator_m3a -- --nocapture 2>&1 | tee emulator-gate.log
          # The gate tests print "skipped: ..." and pass when the emulator is
          # not enabled; that must never count as a green gate.
          if grep -q 'skipped:' emulator-gate.log; then
            echo "::error::An emulator gate test skipped itself; the gate did not run."
            exit 1
          fi
          # ...and all five binaries must positively report that every test ran and passed.
          if [ "$(grep -c 'test result: ok. 1 passed' emulator-gate.log)" -ne 4 ] || [ "$(grep -c 'test result: ok. 2 passed' emulator-gate.log)" -ne 1 ]; then
            echo "::error::All five emulator gate binaries must report 'test result: ok' with every test passed (m0, m1, m1c, m3a: 1 each; m2a: 2)"
            exit 1
          fi
          # The M3a gate must run to its last step (its emulator limits are GATE-NOTE lines).
          if ! grep -q 'm3a_manage: all steps passed' emulator-gate.log; then
            echo "::error::The M3a manage gate (emulator_m3a) did not run to the end."
            exit 1
          fi
          # The desktop operate gate (M2b) runs the app's own operate path.
          DISPATCHED_EMULATOR=1 cargo test --locked -p dispatched-app --lib emulator_m2b -- --nocapture 2>&1 | tee emulator-app.log
          if grep -q 'skipped:' emulator-app.log || ! grep -q 'emulator_m2b: all steps passed' emulator-app.log; then
            echo "::error::The desktop emulator gate (emulator_m2b) did not run to the end."
            exit 1
          fi
          # The MCP server end to end (M4a): an rmcp client answers its confirmation forms.
          DISPATCHED_EMULATOR=1 cargo test --locked -p dispatched --bin dispatched mcp_emulator -- --nocapture 2>&1 | tee emulator-mcp.log
          if grep -q 'skipped:' emulator-mcp.log || ! grep -q 'mcp_emulator: all steps passed' emulator-mcp.log; then
            echo "::error::The MCP gate (mcp_emulator) did not run to the end."
            exit 1
          fi
          # The desktop manage and listener gate (M3b).
          DISPATCHED_EMULATOR=1 cargo test --locked -p dispatched-app --lib emulator_m3b -- --nocapture 2>&1 | tee emulator-app-m3b.log
          if grep -q 'skipped:' emulator-app-m3b.log || ! grep -q 'emulator_m3b: all steps passed' emulator-app-m3b.log; then
            echo "::error::The desktop manage gate (emulator_m3b) did not run to the end."
            exit 1
          fi
      - if: always()
        run: |
          testing/emulator/emulator.sh logs || true
          testing/emulator/emulator.sh down
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dispatched/app
    steps:
      - uses: actions/checkout@v4
        with: { path: dispatched }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dispatched/app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env: { CI: "1" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: dispatched/app/playwright-report, retention-days: 7 }
