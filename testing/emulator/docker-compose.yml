name: dispatched-servicebus-emulator
services:
  emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    volumes:
      - "./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in testing/emulator/.env}"
      ACCEPT_EULA: "${ACCEPT_EULA:?set ACCEPT_EULA=Y in testing/emulator/.env}"
      EMULATOR_HTTP_PORT: 5300
    depends_on: [mssql]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA:?set ACCEPT_EULA=Y in testing/emulator/.env}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in testing/emulator/.env}"
